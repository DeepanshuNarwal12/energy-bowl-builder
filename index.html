
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Energy Bowl Builder</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>🥣 Energy Bowl Builder</h1>
        <p>Fresh ingredients. Your perfect bowl.</p>
    </header>

    <main>
        <section class="builder-container">

            <h2>Build Your Perfect Bowl</h2>
            <p class="intro">
                Customize your healthy and delicious energy bowl!
            </p>

            <!-- Bowl Customization Form -->
            <form id="bowlForm">

                <!-- Base Selection -->
                <div class="form-group">
                    <label for="base">Choose Your Base</label>

                    <select id="base" name="base" required>
                        <option value="">Select a base</option>
                        <option value="Acai Berry">Acai Berry</option>
                        <option value="Greek Yogurt">Greek Yogurt</option>
                        <option value="Oatmeal">Oatmeal</option>
                        <option value="Chia Pudding">Chia Pudding</option>
                    </select>
                </div>

                <!-- Bowl Size -->
                <div class="form-group">
                    <label for="size">Choose Your Size</label>

                    <select id="size" name="size" required>
                        <option value="">Select a size</option>
                        <option value="Small">Small</option>
                        <option value="Medium">Medium</option>
                        <option value="Large">Large</option>
                    </select>
                </div>

                <!-- Fruits -->
                <fieldset class="form-group">
                    <legend>Choose Your Fruits</legend>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox"
                                   name="fruits"
                                   value="Banana">
                            🍌 Banana
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="fruits"
                                   value="Strawberry">
                            🍓 Strawberry
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="fruits"
                                   value="Blueberry">
                            🫐 Blueberry
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="fruits"
                                   value="Mango">
                            🥭 Mango
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="fruits"
                                   value="Pineapple">
                            🍍 Pineapple
                        </label>
                    </div>
                </fieldset>

                <!-- Toppings -->
                <fieldset class="form-group">
                    <legend>Choose Your Toppings</legend>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox"
                                   name="toppings"
                                   value="Granola">
                            Granola
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="toppings"
                                   value="Coconut Flakes">
                            Coconut Flakes
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="toppings"
                                   value="Almonds">
                            Almonds
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="toppings"
                                   value="Chia Seeds">
                            Chia Seeds
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="toppings"
                                   value="Chocolate Chips">
                            Chocolate Chips
                        </label>
                    </div>
                </fieldset>

                <!-- Protein -->
                <div class="form-group">
                    <label for="protein">Protein Add-On</label>

                    <select id="protein" name="protein">
                        <option value="None">No Protein</option>
                        <option value="Whey Protein">Whey Protein</option>
                        <option value="Plant Protein">Plant Protein</option>
                        <option value="Peanut Butter">Peanut Butter</option>
                    </select>
                </div>

                <!-- Sweetener -->
                <div class="form-group">
                    <label for="sweetener">Choose a Sweetener</label>

                    <select id="sweetener" name="sweetener">
                        <option value="None">No Sweetener</option>
                        <option value="Honey">Honey</option>
                        <option value="Maple Syrup">Maple Syrup</option>
                        <option value="Agave Syrup">Agave Syrup</option>
                    </select>
                </div>

                <!-- Special Instructions -->
                <div class="form-group">
                    <label for="instructions">
                        Special Instructions
                    </label>

                    <textarea
                        id="instructions"
                        name="instructions"
                        rows="4"
                        maxlength="300"
                        placeholder="Any special requests?">
                    </textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="order-btn">
                    Place Order
                </button>

            </form>
        </section>

        <!-- Order Summary -->
        <section
            id="orderSummary"
            class="order-summary"
            hidden
            aria-live="polite">

            <h2>Your Order Summary</h2>
            <div id="orderDetails"></div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Energy Bowl Builder</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/EnergyBowl.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
